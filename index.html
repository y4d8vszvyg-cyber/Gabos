<style>
/* Layout: one centred ticket card on a dark night background, like the original */
:root{
  --bg:#130d22; --card:#1c1430; --line:#f08a24; --orange:#f39a2c;
  --text:#f4ecff; --muted:#c9b6ef; --white:#fff; --ink:#000;
  --display:"Verdana","DejaVu Sans",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%;margin:0}
body{background:radial-gradient(ellipse at 20% 0%,#3a1d10 0%,transparent 45%),radial-gradient(ellipse at 90% 100%,#2b1650 0%,transparent 50%),var(--bg);
  color:var(--text);font-family:system-ui,-apple-system,sans-serif;
  padding-block:28px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;align-items:center;gap:22px}
.wrap{background:#160f27;border-radius:26px;padding:14px;width:100%;max-width:400px;box-shadow:0 20px 60px #0008}
.ticket{border:2px solid var(--line);border-radius:22px;padding:22px 20px 18px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.pumpkin{width:46px;height:52px}
h1{margin:4px 0 0;font-family:var(--display);font-weight:800;color:var(--orange);letter-spacing:.06em;font-size:clamp(22px,7vw,30px)}
.kind{color:var(--muted);letter-spacing:.06em;font-size:15px}
.name{font-family:var(--display);font-weight:800;font-size:clamp(26px,8.5vw,36px);margin:4px 0 10px;letter-spacing:.02em}
.qr{background:var(--white);border-radius:16px;padding:12%;width:100%;max-width:300px;aspect-ratio:1;box-sizing:border-box;border:0;display:block}
.qr svg{width:100%;height:100%;display:block}
.hint{font-size:14px;margin-top:6px}
.note{color:var(--muted);text-align:center;max-width:360px;font-size:16px;line-height:1.4;margin:0}
</style>
</head>
